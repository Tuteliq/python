name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned to an image that carries every Python version in the matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # setuptools too: the runner's preinstalled copy has known advisories, which pip-audit reports.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Audit dependencies
        run: |
          pip install pip-audit
          # The package's own dependencies, resolved in isolation, so the runner's and the audit
          # tool's own packages are not reported as the SDK's.
          pip-audit .

      - name: Run type checker
        run: mypy tuteliq

      - name: Run linter
        run: ruff check tuteliq tests

      - name: Run tests
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
